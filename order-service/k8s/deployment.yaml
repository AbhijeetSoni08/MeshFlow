apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: meshflow
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: order-service
          image: meshflow/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database-url
            - name: USER_SERVICE_URL
              value: "http://user-service.meshflow.svc.cluster.local:3001"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service.meshflow.svc.cluster.local:3002"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
