services:
  postgres:
    image: postgres:15-alpine
    container_name: meshflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meshflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meshflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meshflow-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: meshflow-user-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/meshflow
      JWT_SECRET: meshflow-dev-secret-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - meshflow-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: meshflow-product-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/meshflow
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - meshflow-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: meshflow-order-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/meshflow
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - meshflow-network

networks:
  meshflow-network:
    driver: bridge

volumes:
  postgres_data:
