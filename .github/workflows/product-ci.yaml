name: Product Service CI/CD

on:
  push:
    paths:
      - 'product-service/**'
      - '.github/workflows/product-ci.yaml'
  pull_request:
    paths:
      - 'product-service/**'
      - '.github/workflows/product-ci.yaml'

jobs:
  test-and-build:
    name: Test, Build & Push Product Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: product-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          file: ./product-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/meshflow-product-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/meshflow-product-service:${{ github.sha }}
