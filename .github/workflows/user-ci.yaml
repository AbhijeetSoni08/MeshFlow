name: User Service CI/CD

on:
  push:
    paths:
      - 'user-service/**'
      - '.github/workflows/user-ci.yaml'
  pull_request:
    paths:
      - 'user-service/**'
      - '.github/workflows/user-ci.yaml'

jobs:
  test-and-build:
    name: Test, Build & Push User Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: user-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/meshflow-user-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/meshflow-user-service:${{ github.sha }}

      # Phase 6: Continuous Deployment via kubectl set image
      - name: Deploy to Kubernetes cluster
        if: github.event_name == 'push'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::notice::KUBECONFIG secret is not configured in repository secrets. Skipping remote cluster deployment."
            exit 0
          fi
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config 2>/dev/null || echo "$KUBECONFIG_DATA" > $HOME/.kube/config
          kubectl set image deployment/user-service user-service=${{ secrets.DOCKERHUB_USERNAME }}/meshflow-user-service:${{ github.sha }} -n meshflow
          kubectl rollout status deployment/user-service -n meshflow --timeout=180s
