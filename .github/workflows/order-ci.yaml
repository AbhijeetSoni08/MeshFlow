name: Order Service CI/CD

on:
  push:
    paths:
      - 'order-service/**'
      - '.github/workflows/order-ci.yaml'
  pull_request:
    paths:
      - 'order-service/**'
      - '.github/workflows/order-ci.yaml'

jobs:
  test-and-build:
    name: Test, Build & Push Order Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: order-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          file: ./order-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/meshflow-order-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/meshflow-order-service:${{ github.sha }}
