apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meshflow-ingress
  namespace: meshflow
  annotations:
    ingress.class: "nginx"
spec:
  rules:
    - http:
        paths:
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 3001
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 3002
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 3003
