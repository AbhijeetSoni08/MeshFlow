apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meshflow-ingress
  namespace: meshflow
  annotations:
    # Rewrite /users/register → /users/register (keep path as-is)
    # This is needed because our services already expect the full path
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  # Use the modern ingressClassName field instead of the deprecated annotation
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Route /users/* to user-service
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 3001
          # Route /products/* to product-service
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 3002
          # Route /orders/* to order-service
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 3003
          # Route / to frontend portal
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
